[package]
name = "focus-timer"
version = "0.1.0"
description = "专注悬浮时钟 - 番茄工作法倒计时"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-runtime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
window-vibrancy = "0.8"
